name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SCHEME: Bide
  PROJECT: Bide.xcodeproj
  SIMULATOR: 'iPhone 17 Pro'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    needs: [lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          if [ -f "$PROJECT/project.pbxproj" ]; then
            xcodebuild -resolvePackageDependencies \
              -project $PROJECT \
              -scheme $SCHEME
          fi

      - name: Build (Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project $PROJECT \
            -scheme $SCHEME \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project $PROJECT \
            -scheme $SCHEME \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      - name: Upload test result bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          retention-days: 14

  sonarcloud:
    name: SonarCloud
    runs-on: macos-latest
    needs: [build-and-test]
    timeout-minutes: 15
    continue-on-error: true # non-blocking until configured + token added
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult

      - name: Convert coverage to SonarCloud generic format
        run: |
          if [ -d "TestResults.xcresult" ]; then
            curl -fsSL "https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/master/swift-coverage/swift-coverage-example/xccov-to-sonarqube-generic.sh" \
              -o xccov-to-sonarqube-generic.sh
            chmod +x xccov-to-sonarqube-generic.sh
            ./xccov-to-sonarqube-generic.sh TestResults.xcresult > sonar-coverage.xml
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
