included:
  - Bide
  - BideTests
  - BideUITests

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - build
  - Pods
  - Carthage
  - "**/Generated"
  - "**/*.generated.swift"

disabled_rules:
  - trailing_whitespace # Xcode handles this consistently
  - todo                # we keep TODOs intentionally
  - line_length         # overridden below

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fatal_error_message
  - first_where
  - identical_operands
  - implicit_return
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - unused_optional_binding
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Rules we deliberately opt OUT of after evaluation:
#
# - attributes: wants @State on its own line above the property. That's
#   the opposite of SwiftUI's established style; we follow Apple's docs.
# - force_unwrapping: useful in production code; noisy in tests where
#   force-unwrap on a known fixture is more readable than guard-let
#   plumbing. Re-enabled below for non-test paths.
# - multiline_arguments / multiline_function_chains: fight the SwiftUI
#   modifier chain idiom. The codebase formats them deliberately; the
#   rule's "one per line OR all on one line" is too binary for what
#   reads cleanest case by case.
# - pattern_matching_keywords: small win, prone to false flags on our
#   `case .scanning(let progress, let label)` style which we prefer
#   readable over compact.

# Test files use force_unwrap freely on known fixtures. Restrict the
# rule's reach to production code.
force_unwrapping:
  severity: warning
  excluded:
    - "BideTests/**"
    - "BideUITests/**"

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 150
  error: 250

# The scan orchestrators (SimilarPhotosScanService.runScan and friends)
# coordinate streaming, persistence, Vision, and progress reporting in
# one place. Splitting them just to hit the default threshold trades
# locality for indirection. Bumped slightly to acknowledge that.
cyclomatic_complexity:
  warning: 20
  error: 30

# SwiftUI views are naturally long. The view bodies + helper builders
# legitimately push past 300 lines on Settings + Dashboard + Help.
type_body_length:
  warning: 600
  error: 1000

# Big PhotoLibraryService.swift wraps all PhotoKit access — splitting
# it would just trade file size for cross-file coupling. Same for the
# Live Photos / Screenshots views with their row + cell subviews.
file_length:
  warning: 1000
  error: 1500

identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - id
    - ok
    - x
    - y
    - z
    - i
    - j
    - n
    - a
    - b
    - c
    - d
    - f
    - m
    - s

# Allow up to 4 elements in a tuple before we ask for a struct. The
# two violation sites are scan-result tuples that are cleaner as
# tuples than ad-hoc types.
large_tuple:
  warning: 4
  error: 5

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

reporter: "xcode"
