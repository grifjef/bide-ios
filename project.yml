# xcodegen spec for Bide iOS
# Regenerate the Xcode project with: xcodegen generate
# (Bide.xcodeproj is gitignored; this file is the source of truth.)

name: Bide
options:
  bundleIdPrefix: com.bidephoto
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Localization scaffolding: the String Catalog (Bide/Localizable.xcstrings)
    # auto-extracts every Text("…") / String(localized:) at build time, so
    # adding a language later is a translation task, not a code task. English
    # is the source language; nothing is translated yet.
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: YN9ADA3LR8
    CODE_SIGN_STYLE: Automatic

targets:
  Bide:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Bide
        excludes:
          - "**/*.md"
      - path: BideShared
    resources:
      - path: Bide/Assets.xcassets
        optional: true
    dependencies:
      - target: BideWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bidephoto.bide
        PRODUCT_NAME: Bide
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Bide/Bide.entitlements
        DEVELOPMENT_ASSET_PATHS: '"Bide/Preview Content"'
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Custom solid-brand launch screen — replaces the auto-generated
        # blank one. The Bide leaf logo lives in AppIcon; we keep the
        # launch screen color-only so the icon→launch handoff reads as
        # one continuous moment.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_CFBundleDisplayName: Bide
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Bide reads your photo library on this device to find clutter — large videos, screenshots, and similar shots — so you can review and clear what you want. Nothing is uploaded by us."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Bide does not add photos. This permission is requested as a fallback only; you can deny it without affecting features."
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Background refresh — quick scan via BGAppRefreshTask so the
        # dashboard is current when the user opens Bide overnight.
        INFOPLIST_KEY_UIBackgroundModes:
          - fetch
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - com.bidephoto.bide.dashboardRefresh

  BideWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BideWidget
        excludes:
          - "Info.plist"
      - path: BideShared
    resources:
      - path: Bide/Assets.xcassets
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bidephoto.bide.widget
        PRODUCT_NAME: BideWidget
        # Explicit Info.plist (not generated) because WidgetKit extensions
        # need the nested NSExtension > NSExtensionPointIdentifier dict,
        # which INFOPLIST_KEY_* flattens incorrectly.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BideWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BideWidget/BideWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

  BideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BideTests
      - path: BideShared
    dependencies:
      - target: Bide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bidephoto.bide.tests
        GENERATE_INFOPLIST_FILE: YES

  BideUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BideUITests
    dependencies:
      - target: Bide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bidephoto.bide.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bide

schemes:
  Bide:
    build:
      targets:
        Bide: all
        BideTests: [test]
        BideUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Bide
      targets:
        - BideTests
        - BideUITests
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
